# PostgreSQL cho môi trường dev. Lần chạy đầu tiên (volume còn trống),
# Postgres tự nạp schema rồi seed theo thứ tự tên file trong initdb.d.
# Muốn nạp lại từ đầu: docker compose down -v && docker compose up -d
services:
  db:
    image: postgres:17
    container_name: taxlaw-db
    environment:
      POSTGRES_USER: taxlaw
      POSTGRES_PASSWORD: taxlaw
      POSTGRES_DB: taxlaw
    ports:
      - "5432:5432"
    volumes:
      - taxlaw-data:/var/lib/postgresql/data
      - ./artifacts/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./artifacts/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  taxlaw-data:
